name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend（ruff + pytest 全量）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（与生产镜像同构：不含 ai extras）
        run: uv sync --frozen
      - name: 空库迁移重放（ADR-0029 基线）
        run: |
          uv run alembic upgrade head
          uv run alembic current | grep -q "a00000000000"
      - name: ruff
        run: uv run ruff check app tests
      - name: pytest 全量（覆盖率护栏 62%：CI 全量口径基线 62.8%）
        run: uv run pytest -q --cov=app --cov-fail-under=62

  frontend:
    name: frontend（vue-tsc + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint（error 阻断）
        run: npm run lint
      - name: 单元测试（vitest）
        run: npm run test
      - run: npm run build

  docker:
    name: docker 构建冒烟
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建 backend 镜像
        run: docker build -t child-code-backend:ci backend
