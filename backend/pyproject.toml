[project]
name = "child-code-backend"
version = "0.1.0"
description = "智能少儿编程教育管理系统 - 后端服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pwdlib[bcrypt]>=0.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "pypinyin>=0.55.0",
    # 文档导出（PPT/PDF/DOCX，启动链直接引用，属于核心运行时）
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# AI 能力（M3+ 使用）：模型编排 / 向量检索 / PPT 生成
# AI 能力（模型编排/向量检索，重型，需科学上网，按需 uv sync --extra ai）
ai = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[dependency-groups]
# 开发与质检（uv run 默认同步，见 tool.uv.default-groups）
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 让 uv run 默认同步 dev 组（pytest/ruff/httpx），避免被裁剪
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
